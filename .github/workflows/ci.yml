name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Enable pnpm via corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check (typecheck, tests, dependency graph)
        run: pnpm check
      - name: Build web
        run: pnpm --filter @running-live-tracker/web build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Test and build debug + release APKs
        run: ./gradlew test assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/**/*.apk
